server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router (BrowserRouter): /shop, /user kabi sahifalar yangilanganda 404 bo'lmasligi uchun
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # video va rasmlar: brauzer 7 kun keshlaydi
    location ~* \.(mp4|jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
